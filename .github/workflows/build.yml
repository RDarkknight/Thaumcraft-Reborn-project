name: Build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run server gametests
        run: ./gradlew build
      - name: Run datagen and verify generated files
        run: |
          ./gradlew runDatagen
          git diff --exit-code src/main/generated
      - name: Run client gametests
        run: xvfb-run -a ./gradlew runClientGametest
